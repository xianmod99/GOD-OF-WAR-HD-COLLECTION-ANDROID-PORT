name: build-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ambil so native dari APK resmi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p rel build/lib
          gh release download --repo luisxl15/GOD-OF-WAR-HD-COLLECTION-ANDROID-PORT --pattern '*.apk' --dir rel
          ls -la rel
          unzip -o -j rel/*.apk 'lib/arm64-v8a/*.so' -d build/lib
          ls -la build/lib
          test -f build/lib/libvitart.so
          test -f build/lib/libvt_eboot.so
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
